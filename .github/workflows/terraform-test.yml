name: Terraform Test

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tftest.hcl'
      - 'build.sh'
      - 'function/**'
      - '.github/workflows/terraform-test.yml'

permissions:
  contents: read

jobs:
  terraform-test:
    name: Module Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      # build.sh runs under this interpreter; 3.13 matches the Lambda runtime and
      # ships a modern pip that honours --require-hashes with cross-platform wheels.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Credential-free: mock_provider fakes AWS, but build.sh runs for real with
      # the module consumed from a subdirectory (nested path.module), exercising
      # the packaging path that static analysis and a root-level plan cannot see.
      - name: Terraform test
        run: |
          cd tests/harness
          terraform init -no-color
          terraform test -no-color
